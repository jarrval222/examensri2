<VirtualHost *:80>
    ServerName www.javierarrabal.test
    Redirect permanent / https://www.javierarrabal.test/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.javierarrabal.test
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/examen.crt
    SSLCertificateKeyFile /etc/ssl/certs/examen.key

    ErrorDocument 404 /error.html

    <Directory "/var/www/html/admin">
        AuthType Basic
        AuthName "Admin Area"
        AuthUserFile /etc/apache2/.htpasswd
        AuthGroupFile /etc/apache2/.htgroups
        Require group webadmin
    </Directory>
</VirtualHost>